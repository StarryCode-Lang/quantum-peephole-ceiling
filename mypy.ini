; Static type checking for the reusable library code only.
;
; Scope: src/ only. experiments/, analysis/ and scripts/ are research drivers
; with heavy dynamic Qiskit interaction and are intentionally out of scope for
; the first typing pass. See docs/review/science_boost/2026-10-17_innovation_scan.md
; for the rationale (this config exists to catch the class of default-value
; drift that produced Known Issue 9 in data/DATA_CANONICAL.md).
;
; Run:  python -m mypy src

[mypy]
python_version = 3.12
explicit_package_bases = True
mypy_path = .
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True
pretty = False
; Non-strict on purpose: the library uses numpy-heavy dynamic idioms.
disallow_untyped_defs = False
check_untyped_defs = False
