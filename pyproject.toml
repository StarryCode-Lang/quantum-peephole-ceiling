[project]
name = "q-research"
version = "10.1.0"
description = "Representation-conditioned peephole ceilings in quantum circuit optimization (listing-model sensitivity, search-space stratification, Phase-2b template validation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Q-research authors (see docs/manuscript/manuscript.md Declarations)" },
]

# Single source of truth for dependency pins is requirements.txt
# (transitive lock with hashes: requirements-lock.txt). Dependencies are
# read dynamically from requirements.txt to avoid duplicated pin lists.
dynamic = ["dependencies"]

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "pytest-timeout==2.3.1",
]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
